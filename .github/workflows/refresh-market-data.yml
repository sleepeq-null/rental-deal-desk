name: Refresh area market data

# Zillow publishes new ZORI/ZHVI files mid-month; pull them a few days later.
on:
  schedule:
    - cron: "0 12 20 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build data/zip-market.json from Zillow Research CSVs
        run: node scripts/build-market-data.mjs
      - name: Commit if the data changed
        run: |
          if git diff --quiet -- data/zip-market.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/zip-market.json
          git commit -m "Refresh area market data from Zillow Research"
          git push
